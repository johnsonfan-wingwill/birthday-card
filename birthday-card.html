<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日日好日｜生日賀卡工作室</title><meta name="description" content="輸入姓名與生日，為重要的人製作專屬生日賀卡，免費下載圖片。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232847ef'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-size='25' fill='white'%3E✦%3C/text%3E%3C/svg%3E"><style>
:root{font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:#202126;background:#f6f6f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{height:88px;border-bottom:1px solid #e1e2e7;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:#fff}.brand{font-size:22px;font-weight:800;letter-spacing:2px}.brand span{color:#2847ef;margin-right:10px}header small{font-size:14px;color:#777}main{max-width:1240px;margin:auto;padding:42px 32px 28px}.intro{margin-bottom:30px}h1{font-size:32px;letter-spacing:-1px;margin:0 0 10px}.intro p{color:#686974;margin:0;line-height:1.8}.workspace{display:grid;grid-template-columns:340px 1fr;gap:36px;align-items:start}.controls{background:white;border:1px solid #e3e4ea;border-radius:20px;padding:28px}.eyebrow{font-size:12px;letter-spacing:3px;color:#777b8d;font-weight:700;margin-bottom:25px}label,legend{display:block;font-size:15px;font-weight:650;margin-bottom:10px}input{width:100%;font:inherit;padding:13px 14px;border:1px solid #d9dce5;border-radius:9px;min-height:49px;background:white;color:#252632}input:focus{outline:3px solid #cdd5ff;border-color:#2847ef}.field{margin-bottom:24px}.hint{font-size:13px;color:#737581;line-height:1.7;margin:8px 0 0}fieldset{border:0;padding:0;margin:0 0 26px}.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.style{border:1px solid #dfe1e7;border-radius:10px;padding:10px 4px;background:white;font:inherit;font-size:13px;cursor:pointer}.style i{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 8px}.style[aria-pressed=true]{border:2px solid #2847ef;background:#f1f4ff;padding:9px 3px}button{cursor:pointer}button:focus-visible{outline:3px solid #92a6ff;outline-offset:3px}.primary{width:100%;border:0;border-radius:10px;background:#2847ef;color:#fff;font:inherit;font-weight:650;padding:16px}.primary:hover{background:#1935ca}.privacy{font-size:12px;color:#82848f;line-height:1.8;text-align:center;margin:16px 0 0}.preview-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;font-size:14px;color:#626573}.preview-head span:last-child{font-size:12px;letter-spacing:1px}.stage{background:#e9ebf2;border-radius:18px;padding:28px;display:flex;justify-content:center;overflow:hidden}canvas{display:block;width:100%;max-width:490px;height:auto;box-shadow:0 14px 28px #21275622;border-radius:2px}.actions{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px}.secondary{border:1px solid #cfd2de;border-radius:9px;padding:12px 18px;background:#fff;font:inherit;font-size:14px;color:#333}.download{background:#20232e;color:white;border-color:#20232e}.status{font-size:13px;color:#555b6e;min-height:24px;margin-top:12px}footer{max-width:1240px;margin:25px auto 0;padding:22px 32px;border-top:1px solid #e0e2e8;font-size:12px;color:#888b97;display:flex;justify-content:space-between}@media(max-width:760px){header{height:72px;padding:0 22px}header small{display:none}main{padding:28px 20px}.workspace{grid-template-columns:1fr;gap:25px}.controls{padding:22px}h1{font-size:26px}.stage{padding:18px}.intro{margin-bottom:22px}footer{margin-top:15px;padding:20px;gap:20px}.actions{flex-wrap:wrap}.eyebrow{margin-bottom:18px}}
</style></head><body><header><div class="brand"><span>✦</span>日日好日</div><small>生日賀卡工作室</small></header><main><div class="intro"><h1>把這一天，變成一張祝福。</h1><p>寫下姓名與生日，送上一張只屬於對方的賀卡。</p></div><div class="workspace"><form class="controls" id="form"><div class="eyebrow">MAKE SOMEONE'S DAY</div><div class="field"><label for="name">送給誰？</label><input id="name" placeholder="輸入姓名或暱稱" maxlength="30" required autocomplete="off"><p class="hint">最多 30 個字，不需要填寫全名。</p></div><div class="field"><label for="birthday">生日</label><input id="birthday" type="date" required><p class="hint">賀卡只顯示月日，不顯示出生年份。</p></div><fieldset><legend>挑選一種心意</legend><div class="styles"><button type="button" class="style" data-theme="blue" aria-pressed="true"><i style="background:#2847ef"></i>晴朗藍</button><button type="button" class="style" data-theme="pink" aria-pressed="false"><i style="background:#ff86ad"></i>甜蜜粉</button><button type="button" class="style" data-theme="night" aria-pressed="false"><i style="background:#202839"></i>星夜金</button></div></fieldset><button class="primary" type="submit">製作專屬賀卡 ✦</button><p class="privacy">姓名與生日只在你的瀏覽器中處理。</p></form><section aria-label="賀卡預覽"><div class="preview-head"><span id="preview-label">賀卡預覽 · 範例</span><span>1080 × 1350 PNG</span></div><div class="stage"><canvas id="card" width="1080" height="1350" role="img" aria-label="生日賀卡範例"></canvas></div><div class="actions"><button type="button" id="shuffle" class="secondary">換一句祝福 ↻</button><button type="button" id="download" class="secondary download">下載賀卡 ↓</button></div><div class="status" id="status" role="status" aria-live="polite"></div></section></div></main><footer><span>一張賀卡，一份剛剛好的心意。</span><span>日日好日 © 2026</span></footer><script>
const canvas=document.getElementById('card'),ctx=canvas.getContext('2d');
const nameInput=document.getElementById('name'),dateInput=document.getElementById('birthday'),statusEl=document.getElementById('status');
const palettes={blue:{bg:'#2847ef',ink:'#fff9dd',accent:'#dfff78',muted:'#bbc9ff'},pink:{bg:'#ff9ab8',ink:'#6a1947',accent:'#fff2bf',muted:'#98395e'},night:{bg:'#202839',ink:'#f5dea4',accent:'#c5a467',muted:'#b3b9c7'}};
const wishes=[['願你眼裡有光，心裡有夢，','每一天都活成喜歡的模樣。'],['願所有美好，都如期而至，','新的一歲，繼續閃閃發亮。'],['把日子過成自己喜歡的樣子，','把快樂留給每一個明天。'],['願你被溫柔以待，也勇敢向前，','一路有驚喜，一生有熱愛。']];
let state={name:'親愛的你',month:9,day:23,theme:'blue',wish:0,created:false};
function text(s,y,size,color,weight='400'){ctx.fillStyle=color;ctx.font=weight+' '+size+'px system-ui,"Microsoft JhengHei",sans-serif';ctx.textAlign='center';ctx.fillText(s,540,y)}
function render(){const p=palettes[state.theme];ctx.fillStyle=p.bg;ctx.fillRect(0,0,1080,1350);ctx.strokeStyle=p.muted;ctx.lineWidth=2;ctx.strokeRect(45,45,990,1260);ctx.beginPath();ctx.arc(1080,0,315,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(0,1350,300,0,Math.PI*2);ctx.stroke();text('A DAY JUST FOR YOU',135,23,p.ink,'600');text(String(state.month).padStart(2,'0')+' / '+String(state.day).padStart(2,'0'),245,70,p.accent,'400');text('HAPPY',475,150,p.ink,'900');text('BIRTHDAY',635,139,p.ink,'900');text('✦',756,73,p.accent);let size=64;ctx.font='600 '+size+'px system-ui';while(ctx.measureText(state.name).width>860&&size>24){size--;ctx.font='600 '+size+'px system-ui'}text(state.name,890,size,p.ink,'600');text('生日快樂',963,30,p.ink);text(wishes[state.wish][0],1090,30,p.ink);text(wishes[state.wish][1],1145,30,p.ink);text('願今天的你，比昨天更快樂。',1250,21,p.muted);canvas.setAttribute('aria-label',state.name+'，'+state.month+'月'+state.day+'日生日快樂。'+wishes[state.wish].join(''));document.getElementById('preview-label').textContent=state.created?'你的專屬賀卡':'賀卡預覽 · 範例';}
function createCard(name,birthday){if(typeof name!=='string'||!name.trim()||Array.from(name.trim()).length>30)throw Error('請填寫 1 至 30 個字的姓名。');if(typeof birthday!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(birthday))throw Error('請選擇有效的生日。');const [year,month,day]=birthday.split('-').map(Number),date=new Date(birthday+'T12:00:00');if(year<1||isNaN(date)||date.getFullYear()!==year||date.getMonth()+1!==month||date.getDate()!==day)throw Error('請選擇有效的生日。');state={...state,name:name.trim(),month,day,created:true};nameInput.value=name.trim();dateInput.value=birthday;render();statusEl.textContent='賀卡完成！可以下載圖片，把祝福送給對方。';return {name:state.name,month,day,theme:state.theme};}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();try{createCard(nameInput.value,dateInput.value)}catch(error){statusEl.textContent=error.message}});
document.querySelectorAll('[data-theme]').forEach(button=>button.addEventListener('click',()=>{state.theme=button.dataset.theme;document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()}));
document.getElementById('shuffle').addEventListener('click',()=>{state.wish=(state.wish+1)%wishes.length;render();statusEl.textContent='已換上新的祝福。'});
document.getElementById('download').addEventListener('click',()=>{if(!state.created){if(!document.getElementById('form').reportValidity())return;try{createCard(nameInput.value,dateInput.value)}catch(error){statusEl.textContent=error.message;return}}canvas.toBlob(blob=>{if(!blob){statusEl.textContent='圖片暫時無法下載，請再試一次。';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='生日快樂-'+state.name.replace(/[<>:"/\\|?*]/g,'')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);statusEl.textContent='賀卡圖片已準備下載。';},'image/png')});
const lifecycle=new AbortController();try{if(document.modelContext?.registerTool)Promise.resolve(document.modelContext.registerTool({name:'create_birthday_card',description:'根據姓名與生日製作賀卡，更新畫面預覽，不會自動下載。',inputSchema:{type:'object',properties:{name:{type:'string',minLength:1,maxLength:30},birthday:{type:'string',description:'YYYY-MM-DD'}},required:['name','birthday'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>createCard(input.name,input.birthday)},{signal:lifecycle.signal})).catch(()=>{})}catch{}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});render();
</script></body></html>
